# Shared toolchain setup for the Depot CI workflows: Socket firewall, pnpm, Node, optional Foundry,
# and the workspace install. Each workflow checks out first, because this file comes from the checkout.

name: setup
description: Install the toolchain and the workspace dependencies

inputs:
  solidity:
    description: Install Foundry for the Solidity projects
    default: "false"

runs:
  using: composite
  steps:
    - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall-free
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: lts/*
        cache: pnpm
    - if: inputs.solidity == 'true'
      uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      with:
        # Pinned to the forge release used locally. 1.8 adds lint rules this code does not pass yet.
        version: v1.7.1
    - run: pnpm install --frozen-lockfile
      shell: bash
