# Depot CI. Formats, lints, tests, and builds Solidity projects when the listed paths change.
#
# SECURITY: dependency installation and test tooling execute code from the PR. Keep the token
# read-only and do not pass secrets or grant OIDC permission; PR code could use those credentials.
#
# Fork PRs are skipped here.

name: solidity

on:
  push:
    branches: [master]
    paths:
      - "solidity/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".depot/workflows/solidity.yml"
  pull_request:
    branches: [master]
    paths:
      - "solidity/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - ".depot/workflows/solidity.yml"

permissions: {}

env:
  TURBO_TELEMETRY_DISABLED: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check_test_build:
    permissions:
      contents: read
    # Pushes to master and same-repository pull requests, Dependabot included.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          # Pinned to the forge release used locally. 1.8 adds lint rules this code does not pass yet.
          version: v1.7.1
      - run: pnpm exec turbo run check --filter='./solidity/*'
