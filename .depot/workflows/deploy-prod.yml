# Depot CI. Deploys apps to production through their deploy:prod scripts. It runs only by hand:
# `pnpm run apps:deploy:prod` from the root, `depot ci dispatch`, or the Depot dashboard.
# Without the app input it deploys every app that has a deploy:prod script.

name: deploy-prod

on:
  workflow_dispatch:
    inputs:
      app:
        description: Package name of the app to deploy. Empty deploys every app with deploy:prod.
        required: false
        default: ""

permissions: {}

env:
  TURBO_TELEMETRY_DISABLED: 1

concurrency:
  group: apps-deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.depot/actions/setup
      - name: Deploy to production
        env:
          APP: ${{ inputs.app }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
          # The triad-auth secrets. The four Better Auth ones are the prod variant, scoped to this workflow.
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          IDENTIFIER_SECRET: ${{ secrets.IDENTIFIER_SECRET }}
          RATE_LIMIT_SECRET: ${{ secrets.RATE_LIMIT_SECRET }}
          ENCRYPTION_SECRETS: ${{ secrets.ENCRYPTION_SECRETS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GITHUB_CLIENT_ID: ${{ secrets.GITHUB_CLIENT_ID }}
          GITHUB_CLIENT_SECRET: ${{ secrets.GITHUB_CLIENT_SECRET }}
          TWITTER_CLIENT_ID: ${{ secrets.TWITTER_CLIENT_ID }}
          TWITTER_CLIENT_SECRET: ${{ secrets.TWITTER_CLIENT_SECRET }}
        # Arguments after -- reach every deploy script; --yes answers the Alchemy prompts.
        run: pnpm exec turbo run deploy:prod ${APP:+--filter="$APP"} -- --yes
