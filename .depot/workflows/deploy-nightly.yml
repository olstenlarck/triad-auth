# Depot CI. After ci succeeds for a master push, deploys the apps that push changed through their
# deploy:nightly scripts. Alchemy apps deploy with the CLOUDFLARE_API_TOKEN secret, minted by
# infra/ci-token/alchemy.run.ts.

name: deploy-nightly

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]

permissions: {}

env:
  TURBO_TELEMETRY_DISABLED: 1

concurrency:
  group: apps-deploy-nightly
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    permissions:
      contents: read
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # master takes squash merges, so the pushed commit's parent is the previous master. A direct
      # push of several commits only counts the last one.
      - name: Deploy the apps this push changed
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # github.sha is the current master head in workflow_run, not the commit ci checked.
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          TURBO_SCM_BASE: ${{ github.event.workflow_run.head_sha }}^1
          TURBO_SCM_HEAD: ${{ github.event.workflow_run.head_sha }}
        # Arguments after -- reach every deploy script; --yes answers the Alchemy prompts.
        # triad-auth has its own deploy:nightly, which Workers Builds runs.
        run: pnpm exec turbo run deploy:nightly --affected --filter='!triad-auth' -- --yes
