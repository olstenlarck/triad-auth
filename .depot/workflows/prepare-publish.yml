# Depot CI. After ci succeeds for a master push, opens or updates the release PR from pending
# changesets. Publishing is not done here; publish-prod.yml does that after the release PR merges. Manual
# dispatch on master recovers a skipped or failed update.
#
# SECURITY: no OIDC token, so nothing in this job can publish. The PAT is a Depot CI secret used by
# changesets/action so the release PR is a real user PR that receives checks.

name: prepare-publish

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]

permissions: {}

env:
  TURBO_TELEMETRY_DISABLED: 1

concurrency:
  group: packages-prepare-publish
  cancel-in-progress: false

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    permissions:
      contents: read
    runs-on: depot-ubuntu-24.04-4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit ci tested, not whatever master points at by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Runs can finish out of order. Only the run for the current master head may touch the release
      # PR; an older run would version a tree that lacks the newer push's changesets.
      - id: head
        run: |
          git fetch origin master
          if [ "$(git rev-parse origin/master)" = "$(git rev-parse HEAD)" ]; then
            echo current=true >> "$GITHUB_OUTPUT"
          else
            echo "Skipped: master moved past this commit; the newer run maintains the release PR" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
      # No publish-script, so the action only versions and maintains the release PR.
      - if: steps.head.outputs.current == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        # @changesets/changelog-github reads commit and PR data through the GitHub API.
        env:
          GITHUB_TOKEN: ${{ secrets.OLSTENLARCK_HQ_PAT }}
        with:
          github-token: ${{ secrets.OLSTENLARCK_HQ_PAT }}
          version-script: pnpm run packages:version
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"
