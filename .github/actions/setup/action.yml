# Shared toolchain setup for the workflows on Namespace runners:
# Socket firewall, Node, pnpm, optional Foundry, and the workspace install. Each workflow checks out
# first, because this file comes from the checkout. The runner profile caches the toolchain and
# action downloads, so the setup actions use no GitHub cache of their own.

name: setup
description: Install the toolchain and the workspace dependencies

inputs:
  solidity:
    description: Install Foundry for the Solidity projects
    default: "false"

runs:
  using: composite
  steps:
    - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
      with:
        mode: firewall-free
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: lts/*
        package-manager-cache: false
    # Everything below lives on the cache volume: pnpm and its store in ~/.pnpm, pnpm's lockfile
    # verification results in ~/.cache/pnpm, Foundry, the solc compilers, and node_modules.
    - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
      with:
        path: |
          ~/.pnpm
          ~/.cache/pnpm
          ~/.svm
          ~/.foundry
          ${{ github.workspace }}/node_modules
    # pnpm at the packageManager version, installed only when the cached one is another version.
    - shell: bash
      run: |
        export PNPM_HOME="$HOME/.pnpm"
        version=$(jq -r '.packageManager | sub("^pnpm@"; "")' package.json)
        if [ "$("$PNPM_HOME/bin/pnpm" --version 2> /dev/null)" != "$version" ]; then
          curl -fsSL https://get.pnpm.io/install.sh | env PNPM_VERSION="$version" SHELL=bash sh -
        fi
        echo "PNPM_HOME=$PNPM_HOME" >> "$GITHUB_ENV"
        echo "$PNPM_HOME/bin" >> "$GITHUB_PATH"
    # Foundry is pinned to the forge release used locally; 1.8 adds lint rules this code does not
    # pass yet. It installs only when the cached forge is another version, with the installer commit
    # foundry-toolchain v1.9.1 uses.
    - if: inputs.solidity == 'true'
      shell: bash
      env:
        FOUNDRY_VERSION: 1.7.1
      run: |
        export FOUNDRY_DIR="$HOME/.foundry"
        if ! "$FOUNDRY_DIR/bin/forge" --version 2> /dev/null | grep -qx "forge Version: $FOUNDRY_VERSION"; then
          curl -fsSL https://raw.githubusercontent.com/foundry-rs/foundryup/a27902ef04dcb43061fabf343365cb5afc95fc48/foundryup-init.sh | bash
          "$FOUNDRY_DIR/bin/foundryup" --install "v$FOUNDRY_VERSION"
        fi
        echo "$FOUNDRY_DIR/bin" >> "$GITHUB_PATH"
    - uses: namespace-actions/setup-turbocache@a94b84c111f2cc781a4a83c4d07a99f2c63e33d6 # v0.0.3
    # No dependency builds: the packages that ship binaries resolve them at runtime.
    - run: pnpm install --frozen-lockfile --ignore-scripts
      shell: bash
