# Shared toolchain setup for the Namespace workflows: pnpm, Node, optional Foundry, the Namespace
# pnpm cache volume and Turborepo cache, and the workspace install behind Socket Firewall Free.
# Each workflow checks out first, because this file comes from the checkout.

name: setup
description: Install the toolchain and the workspace dependencies

inputs:
  solidity:
    description: Install Foundry for the Solidity projects
    default: "false"

runs:
  using: composite
  steps:
    # The standalone pnpm at the version in packageManager.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    # The Namespace toolchain cache keeps the Node download; the cache volume keeps the pnpm store.
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.21.0
        package-manager-cache: false
    - uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
      with:
        cache: pnpm
        # The solc compilers forge downloads.
        path: ~/.svm
    - if: inputs.solidity == 'true'
      uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
      with:
        # Pinned to the forge release used locally. 1.8 adds lint rules this code does not pass yet.
        version: v1.7.1
        cache: false
    # Points turbo at the Namespace remote cache. Pull requests read it and never write it, so only
    # master fills the cache that the publish and deploy jobs replay.
    - uses: namespace-actions/setup-turbocache@a94b84c111f2cc781a4a83c4d07a99f2c63e33d6 # v0.0.3
    - if: github.event_name == 'pull_request'
      shell: bash
      run: echo "TURBO_CACHE=local:rw,remote:r" >> "$GITHUB_ENV"
    # Socket Firewall Free blocks known malicious packages while pnpm downloads them.
    - shell: bash
      run: pnpm dlx sfw pnpm install --frozen-lockfile
