# Approves a pull request when tunnckoCore comments /approve on it. The approval comes from the
# PAT owner, which satisfies the one approval the master ruleset requires.
#
# SECURITY: the job runs no repository code. The PAT is used only to approve. Keep the author gate;
# do not extend it to other users.

name: approve-command

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  approve:
    if: >-
      github.event.issue.pull_request && github.event.comment.user.login == 'tunnckoCore' && contains(github.event.comment.body, '/approve')
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.OLSTENLARCK_HQ_PAT }}
          PR: ${{ github.event.issue.number }}
        run: gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --approve
