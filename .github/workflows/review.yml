# Flue review agent from packages/review-agent. It reviews each pull request when it opens or leaves
# draft, and the new commits of every push, with inline findings. When a collaborator replies in one
# of its threads, it answers, and it resolves the thread when it agrees. When it agrees that a
# finding does not apply, it records the decision in a REVIEW.md, which this workflow commits to the
# pull request branch; later reviews read those files. The master ruleset requires the review commit
# status: pending until the agent has reviewed the pull request and while one of its threads is
# unresolved.
#
# A /review comment from tunnckoCore runs a full review again. "/review <model>" also switches the
# model for that pull request: OpenCode Zen model ids, or Workers AI models ("@cf/...") through the
# review-agent Cloudflare AI Gateway. The review body records the model, and later runs keep it.
# The default is OpenCode Zen's free Muse Spark 1.3. issue_comment runs use this file from master.
#
# The review-agent environment holds OPENCODE_API_KEY, CLOUDFLARE_API_KEY (an account token with AI
# Gateway Run and Workers AI access), CLOUDFLARE_ACCOUNT_ID, and CLOUDFLARE_GATEWAY_ID; only this
# workflow uses it. The agent posts and commits as olstenlarck with OLSTENLARCK_HQ_PAT. Its own
# pushes and comments start runs here, so the agent job skips them.
#
# Dependabot and release pull requests never run the agent unless tunnckoCore asks with /review.
# The status job still marks them success, because the ruleset requires the review status on every
# pull request.
#
# SECURITY: the agent runs pull request code and shell commands next to the API keys and the PAT.
# Only same-repository pull requests, replies from the owner, members, and collaborators, and
# /review from tunnckoCore start it. A thread resolved by hand updates the status only at the next
# event of the pull request, because GitHub Actions has no trigger for it.

name: review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]

permissions: {}

jobs:
  agent:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.login == 'tunnckoCore' && startsWith(github.event.comment.body, '/review')) || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]' && !startsWith(github.event.pull_request.title, 'chore: release packages') && ((github.event_name == 'pull_request' && !github.event.pull_request.draft && !(github.event.action == 'synchronize' && github.event.sender.login == 'olstenlarck')) || (github.event_name == 'pull_request_review_comment' && github.event.comment.in_reply_to_id && github.event.comment.user.login != 'olstenlarck' && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))))
    environment:
      name: review-agent
      deployment: false
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Comment events carry no pull request, so every event reads it from the API.
      - id: pull
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefName,baseRefOid,title,body,isCrossRepository > "$RUNNER_TEMP/pull.json"
          if [ "$(jq -r .isCrossRepository "$RUNNER_TEMP/pull.json")" = true ]; then
            echo "Skipped: the agent does not run on fork pull requests" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "PR_NUMBER=$PR" >> "$GITHUB_ENV"
          echo "branch=$(jq -r .headRefName "$RUNNER_TEMP/pull.json")" >> "$GITHUB_OUTPUT"
      - if: steps.pull.outputs.branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pull.outputs.branch }}
          # Full history so the agent can diff against the base and the previous head.
          fetch-depth: 0
          persist-credentials: false
      # A review gets the diff and the agent's unresolved findings. A reply gets its thread, and only
      # when the agent opened the thread and it is still unresolved.
      - id: context
        if: steps.pull.outputs.branch
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          BEFORE: ${{ github.event.before }}
          ROOT: ${{ github.event.comment.in_reply_to_id }}
          COMMAND: ${{ github.event.comment.body }}
        run: |
          head=$(git rev-parse HEAD)
          base=$(jq -r .baseRefOid "$RUNNER_TEMP/pull.json")
          title=$(jq -r .title "$RUNNER_TEMP/pull.json")
          state=$(gh api graphql -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F number="$PR_NUMBER" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  reviews(last: 100) { nodes { author { login } body } }
                  reviewThreads(first: 100) {
                    nodes {
                      id
                      isResolved
                      path
                      line
                      comments(first: 100) { nodes { databaseId author { login } body } }
                    }
                  }
                }
              }
            }' --jq '.data.repository.pullRequest')
          threads=$(jq -c '[.reviewThreads.nodes[] | select(.isResolved | not) | select(.comments.nodes[0].author.login == "olstenlarck")]' <<< "$state")

          # The model: the one that /review names, else the one of the agent's last review, else the
          # agent's default.
          model=$(jq -r '[.reviews.nodes[] | select(.author.login == "olstenlarck") | .body | capture("<!-- review-agent model=(?<m>[^ ]+) -->").m] | last // ""' <<< "$state")
          if [ "$GITHUB_EVENT_NAME" = issue_comment ]; then
            requested=$(head -n1 <<< "$COMMAND" | sed -E 's|^/review[[:space:]]*||; s|[[:space:]]+$||')
            if [ -n "$requested" ]; then
              if ! [[ $requested =~ ^[A-Za-z0-9@/._:-]+$ ]]; then
                echo "::error::Not a model id: $requested"
                exit 1
              fi
              model=$requested
            fi
          fi
          {
            echo "HEAD_SHA=$head"
            echo "REVIEW_MODEL=$model"
          } >> "$GITHUB_ENV"

          if [ "$GITHUB_EVENT_NAME" = pull_request_review_comment ]; then
            thread=$(jq -c --argjson root "$ROOT" '.[] | select(.comments.nodes[0].databaseId == $root)' <<< "$threads")
            if [ -z "$thread" ]; then
              echo "Skipped: the reply is not in an unresolved thread of the agent" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            jq -r --arg pr "$PR_NUMBER" --arg title "$title" '
              "A reply in your thread on pull request #\($pr): \($title)\n\nThread on \(.path), line \(.line // "outdated"):\n\n"
              + ([.comments.nodes[] | "@\(.author.login):\n\n\(.body)"] | join("\n\n---\n\n"))' <<< "$thread" > "$RUNNER_TEMP/message.md"
            {
              echo "COMMENT_ID=$ROOT"
              echo "THREAD_ID=$(jq -r .id <<< "$thread")"
            } >> "$GITHUB_ENV"
            echo run=true >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A push reviews only the new commits, unless the previous head is gone after a force push.
          # /review and a new pull request review the whole diff.
          if [ "$ACTION" = synchronize ] && git merge-base --is-ancestor "$BEFORE" "$head" 2> /dev/null; then
            diff="git diff $BEFORE $head"
          else
            diff="git diff $base...$head"
          fi
          {
            printf 'Review pull request #%s: %s\n\nRead the diff with `%s`. The base commit is %s.\n\n' "$PR_NUMBER" "$title" "$diff" "$base"
            printf 'Your unresolved findings:\n\n'
            jq -r 'if length == 0 then "None." else .[] | "- Comment \(.comments.nodes[0].databaseId) on \(.path), line \(.line // "outdated"):\n\n\(.comments.nodes[0].body)\n" end' <<< "$threads"
            printf '\nDescription:\n\n%s\n' "$(jq -r '.body // ""' "$RUNNER_TEMP/pull.json")"
          } > "$RUNNER_TEMP/message.md"
          echo "OPEN_THREADS=$(jq -c 'map({key: (.comments.nodes[0].databaseId | tostring), value: .id}) | from_entries' <<< "$threads")" >> "$GITHUB_ENV"
          echo run=true >> "$GITHUB_OUTPUT"
      - if: steps.context.outputs.run && github.event_name != 'pull_request_review_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/statuses/$HEAD_SHA" -f state=pending -f context=review \
            -f description="Reviewing" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
      - if: steps.context.outputs.run
        uses: ./.depot/actions/setup
      - if: steps.context.outputs.run
        working-directory: packages/review-agent
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_GATEWAY_ID: ${{ secrets.CLOUDFLARE_GATEWAY_ID }}
          GITHUB_TOKEN: ${{ secrets.OLSTENLARCK_HQ_PAT }}
        run: pnpm exec flue run src/agents/reviewer.ts --message "$(cat "$RUNNER_TEMP/message.md")"
      # Commits each new or changed REVIEW.md through the contents API. The API, not git, makes the
      # commits, so nothing the agent wrote into .git runs next to the PAT.
      - if: steps.context.outputs.run
        env:
          GH_TOKEN: ${{ secrets.OLSTENLARCK_HQ_PAT }}
          BRANCH: ${{ steps.pull.outputs.branch }}
        run: |
          find . -name REVIEW.md -not -path '*/node_modules/*' -printf '%P\n' | while read -r path; do
            current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$BRANCH" --jq '{sha, content}' 2> /dev/null || echo '{}')
            content=$(base64 -w0 < "$path")
            if [ "$(jq -r '.content // "" | gsub("\n"; "")' <<< "$current")" = "$content" ]; then
              continue
            fi
            args=(-f branch="$BRANCH" -f content="$content" -f message="docs: record review decisions in $path")
            sha=$(jq -r '.sha // empty' <<< "$current")
            if [ -n "$sha" ]; then
              args+=(-f sha="$sha")
            fi
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$path" "${args[@]}" > /dev/null
            echo "Committed $path" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  # Runs after every pull request event and every /review, so each new head commit gets the status.
  # The concurrency group runs one at a time per pull request, so the last status reads the newest
  # thread state.
  status:
    needs: agent
    if: always() && github.event.comment.user.login != 'olstenlarck' && (github.event_name != 'issue_comment' || needs.agent.result != 'skipped')
    permissions:
      pull-requests: read
      statuses: write
    concurrency:
      group: review-status-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          AGENT: ${{ needs.agent.result }}
        run: |
          result=$(gh api graphql -F owner="${GITHUB_REPOSITORY%/*}" -F name="${GITHUB_REPOSITORY#*/}" -F number="$PR" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  headRefOid
                  isCrossRepository
                  title
                  author { login }
                  reviews(first: 100) { nodes { author { login } body } }
                  reviewThreads(first: 100) {
                    nodes { isResolved comments(first: 1) { nodes { author { login } } } }
                  }
                }
              }
            }' --jq '.data.repository.pullRequest | [
              .headRefOid,
              .isCrossRepository,
              (.author.login == "dependabot" or (.title | startswith("chore: release packages"))),
              ([.reviews.nodes[] | select(.author.login == "olstenlarck" and (.body | contains("<!-- review-agent")))] | length),
              ([.reviewThreads.nodes[] | select((.isResolved | not) and .comments.nodes[0].author.login == "olstenlarck")] | length)
            ] | @tsv')
          read -r head fork skipped reviewed open <<< "$result"
          if [ "$fork" = true ]; then
            echo "Skipped: fork pull request" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$AGENT" = failure ] || [ "$AGENT" = cancelled ]; then
            state=failure description="The agent run failed; re-run the workflow"
          elif [ "$skipped" = true ] && [ "$reviewed" -eq 0 ]; then
            state=success description="Not reviewed: Dependabot and release pull requests"
          elif [ "$reviewed" -eq 0 ]; then
            state=pending description="Waiting for the review"
          elif [ "$open" -gt 0 ]; then
            state=pending description="$open unresolved review threads"
          else
            state=success description="No unresolved review threads"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$head" -f state="$state" -f context=review \
            -f description="$description" -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          echo "review: $state, $description" | tee -a "$GITHUB_STEP_SUMMARY"
