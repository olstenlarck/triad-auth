# After ci succeeds for a master push, deploys the apps that push changed through their
# deploy:nightly scripts. Run it by hand on master to deploy one app or every app:
# `gh workflow run deploy-nightly.yml [-f app=<name>]`.
#
# The deploys pass no Worker secrets; the Workers keep theirs in Cloudflare. Only the Cloudflare
# credentials for the deploy come from the repository secrets.

name: deploy-nightly

on:
  workflow_dispatch:
    inputs:
      app:
        description: Package name of the app to deploy. Empty deploys every app with deploy:nightly.
        required: false
        default: ""
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]

permissions: {}

env:
  TURBO_TELEMETRY_DISABLED: 1

concurrency:
  group: deploy-nightly
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    permissions:
      contents: read
    runs-on: namespace-profile-monarch
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      # A master push deploys the apps it changed; master takes squash merges, so the pushed
      # commit's parent is the previous master. A manual run deploys one app, or every app.
      # --continue lets the other apps deploy when one fails.
      - env:
          APP: ${{ inputs.app }}
          EVENT: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          TURBO_SCM_BASE: ${{ github.event.workflow_run.head_sha }}^1
          TURBO_SCM_HEAD: ${{ github.event.workflow_run.head_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$APP" ]; then
            scope=(--filter="$APP")
          elif [ "$EVENT" = workflow_dispatch ]; then
            scope=()
          else
            scope=(--affected)
          fi
          pnpm exec turbo run deploy:nightly "${scope[@]}" --continue
