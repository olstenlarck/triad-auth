# Publishes the stable versions with latest, then pushes the package tags and creates the GitHub
# Releases. ci.yml calls it for the merged release PR commit; run it by hand on master to publish
# whatever a failed release left missing: `gh workflow run publish-prod.yml --ref master`. Like
# the nightly, each registry has its own job.
#
# SECURITY: the only jobs in the latest environment that publish. pnpm takes the GitHub OIDC token
# of the latest environment to npm.wgw.lol, which lets it write only latest.

name: publish-prod

on:
  workflow_call:
  workflow_dispatch:

permissions: {}

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  vlt:
    if: github.ref == 'refs/heads/master'
    environment: latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: publish-prod-vlt
      cancel-in-progress: false
    runs-on: namespace-profile-monarch
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bash scripts/publish-prod.sh vlt
        env:
          GITHUB_TOKEN: ${{ secrets.OLSTENLARCK_HQ_PAT }}

  npm:
    if: github.ref == 'refs/heads/master'
    environment: latest
    permissions:
      contents: read
    concurrency:
      group: publish-prod-npm
      cancel-in-progress: false
    runs-on: namespace-profile-monarch
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: bash scripts/publish-prod.sh npm
        env:
          GITHUB_TOKEN: ${{ secrets.OLSTENLARCK_HQ_PAT }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
