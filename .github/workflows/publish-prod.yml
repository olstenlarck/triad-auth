# Publishes stable versions of the @tunnckocore packages with latest, package tags, and
# GitHub Releases. Runs after ci succeeds for the merged release PR commit, or manually on master to
# publish whatever a failed release left missing. Only this workflow may write the latest dist-tag:
# npm.wgw.lol reads the workflow_ref claim of the GitHub Actions OIDC token and maps publish-prod.yml to
# latest. The unscoped packages publish to npm from .github/workflows/npm-publish-prod.yml.
#
# SECURITY: the only job with a latest-capable OIDC token, and it runs only after a human merged the
# release PR or started it by hand on master. The PAT is a repository secret for changesets/action, which pushes
# the package tags and creates the GitHub Releases.

name: publish-prod

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]

permissions: {}

env:
  TURBO_TELEMETRY_DISABLED: 1

concurrency:
  group: packages-publish-prod
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master') || (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       startsWith(github.event.workflow_run.head_commit.message, 'chore: release packages'))
    permissions:
      contents: read
      id-token: write
    runs-on: namespace-profile-monarch
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          # The commit ci tested, not whatever master points at by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The action does not use a shell for publish-script, so it must be one command.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        # @changesets/changelog-github reads commit and PR data through the GitHub API.
        env:
          GITHUB_TOKEN: ${{ secrets.OLSTENLARCK_HQ_PAT }}
        with:
          github-token: ${{ secrets.OLSTENLARCK_HQ_PAT }}
          version-script: pnpm run packages:version
          publish-script: pnpm run packages:publish vlt
          commit-message: "chore: release packages"
          pr-title: "chore: release packages"
