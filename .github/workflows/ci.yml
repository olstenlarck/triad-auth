# Checks, tests, and builds every package, TypeScript and Solidity, on every pull request and every
# push to master, on Namespace runners. turbo replays unchanged tasks from the Namespace Turborepo
# cache. publish-nightly.yml, prepare-publish.yml, publish-prod.yml, and deploy-nightly.yml run
# after this workflow succeeds on master; see each file.
#
# SECURITY: every job runs PR code with a read-only token, no secrets, and no OIDC token.

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions: {}

env:
  TURBO_TELEMETRY_DISABLED: 1
  # Pull requests run only what the branch changed; master runs everything.
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The master ruleset requires check, test, and build. Keep the job names.
  check:
    # Master pushes and same-repository pull requests. Fork pull requests do not reach the
    # Namespace runners.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on: namespace-profile-monarch
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          # Full history so turbo --affected can compare against the base commit.
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          solidity: true
      - run: pnpm exec turbo run check $AFFECTED

  test:
    needs: check
    permissions:
      contents: read
    runs-on: namespace-profile-monarch
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          solidity: true
      # Five forge runs start at once and race to install solc; compile one project first so the
      # compiler is in place before turbo fans out.
      - run: forge build --root solidity/template
      - run: pnpm exec turbo run test $AFFECTED

  # Builds the npm packages and the Solidity projects. Workers Builds builds the apps.
  build:
    needs: check
    permissions:
      contents: read
    runs-on: namespace-profile-monarch
    steps:
      - uses: namespacelabs/nscloud-checkout-action@66f2dc6f6c42a8ac6c4e53473c4840006822831e # v9.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          solidity: true
      - run: forge build --root solidity/template
      - run: pnpm exec turbo run build --filter='./packages/*' --filter='./solidity/*' $AFFECTED
