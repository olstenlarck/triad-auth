# Approves a pull request when tunnckoCore comments /approve on it. The approval comes from the
# PAT owner, which satisfies the approval the master ruleset requires.
#
# SECURITY: the job runs no repository code, and issue_comment runs this file from master. The PAT
# is used only to approve. Keep the author gate; do not extend it to other users.

name: approve

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  approve:
    if: github.event.issue.pull_request && github.event.comment.user.login == 'tunnckoCore' && contains(github.event.comment.body, '/approve')
    environment: nightly
    runs-on: namespace-profile-monarch
    steps:
      - env:
          GH_TOKEN: ${{ secrets.OLSTENLARCK_HQ_PAT }}
          PR: ${{ github.event.issue.number }}
        run: gh pr review "$PR" --repo "$GITHUB_REPOSITORY" --approve
