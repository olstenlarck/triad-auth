# DISABLED BACKUP. GitHub runs workflows only from .github/workflows, so this file never runs.
# The master ruleset holds pull requests with two required approvals instead. To restore the
# label hold, move this file back to .github/workflows and require the do-not-merge status in
# the master ruleset.
#
# Holds a pull request to master while it carries the do-not-merge label. The master ruleset
# requires do-not-merge, so auto-merge waits while it is pending. Each event replaces the
# do-not-merge commit status on the head commit, so a held pull request shows pending, not a
# failure, and the status turns green as soon as the label is removed.
#
# Dependabot never gets the label, and its runs get a read-only token that cannot write a status.
# For Dependabot the job itself is named do-not-merge and passes, which satisfies the ruleset.

name: do-not-merge

on:
  pull_request:
    branches: [master]
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions: {}

concurrency:
  group: do-not-merge-${{ github.event.pull_request.number }}

jobs:
  hold:
    name: ${{ github.actor == 'dependabot[bot]' && 'do-not-merge' || 'hold' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - if: github.actor == 'dependabot[bot]'
        run: echo "Dependabot pull request; no hold"
      - if: github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          labels="$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')"
          if grep -qx do-not-merge <<< "$labels"; then
            state=pending
            description="Held by the do-not-merge label"
          else
            state=success
            description="No hold"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$SHA" \
            -f state="$state" \
            -f context=do-not-merge \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /dev/null
          echo "$description" | tee -a "$GITHUB_STEP_SUMMARY"
